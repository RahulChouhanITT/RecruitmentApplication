version: '3'

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5001
    ports:
      - "3001:80"
    depends_on:
      - backend

  backend:
    build: ./Backend
    ports:
      - "5001:5000"
    env_file:
      - ./Backend/.env.docker
    depends_on:
      - mongo

  mongo:
    image: mongo
    ports:
      - "27018:27017"
